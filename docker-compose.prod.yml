# Produção em uma máquina só: banco + migrações + app. Preencha o .env.prod (copie do .env.example).
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# O banco do desenvolvimento continua no docker-compose.yml.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-showing}
    volumes:
      - showing-db-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-showing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
      args: &args
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?defina NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_EMAIL_PRIVACIDADE: ${NEXT_PUBLIC_EMAIL_PRIVACIDADE:-}
        NEXT_PUBLIC_PERMITIR_INDEXACAO: ${NEXT_PUBLIC_PERMITIR_INDEXACAO:-}
        APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-showing}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: app
      args: *args
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-showing}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  showing-db-prod:
